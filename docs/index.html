<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src 'self'; connect-src data: blob:; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151817"><title>우리의 모든 순간 · 나의 졸업영화</title><meta name="description" content="사진 열두 장, 마음을 담은 편지 한 통. 초등학교 6년을 나만의 졸업영화로 만드세요."><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="desk.css"></head>
<body>
<header><a class="brand" href="./"><span class="brand-mark"><i></i></span><span>우리의 모든 순간<small>졸업영화 편집실</small></span></a><div class="header-right"><span id="saveStatus" class="save-status">임시 작업 · 서버 전송 없음</span><button class="quiet" id="privacyBtn">저장·개인정보</button><button class="quiet" id="importBtn">작업 불러오기</button><button class="outline" id="backupBtn">작업 파일 저장 <span>↗</span></button></div></header>
<main><nav class="steps" aria-label="제작 단계"><button data-step="0" class="active"><span>01</span> 장면 구성</button><button data-step="1" class=""><span>02</span> 성장 사진</button><button data-step="2" class=""><span>03</span> 처음과 지금</button><button data-step="3" class=""><span>04</span> 편지</button><button data-step="4" class=""><span>05</span> 소리</button><button data-step="5" class=""><span>06</span> 엔딩·저장</button></nav><div class="workspace"><aside class="editor"><div id="editorBody"></div><div class="editor-bottom"><span id="stepHelp">한 장 한 장, 추억을 모아요.</span><button id="nextStep" class="next">다음 단계 →</button></div></aside>
<section class="screen-area"><div class="preview-heading"><span><i class="live-dot"></i> 영상 미리보기</span><span class="ratio">16:9</span></div><div class="canvas-wrap"><canvas id="film" width="1280" height="720" aria-label="졸업영상 미리보기"></canvas></div><div class="player"><button id="playBtn" class="play" aria-label="미리보기 재생">▶</button><span id="clock">0:00</span><input id="scrub" type="range" min="0" max="185" step="0.1" value="0" aria-label="영상 재생 위치"><span class="duration">3:05</span><button id="fullBtn" class="fullscreen" aria-label="전체 화면">⛶</button></div><div class="chapter-title"><h2>장면 타임라인</h2><span>장면을 눌러 편집</span></div><div class="timeline" id="timeline"></div><div class="screen-footer"><span></span><button id="demoBtn" class="text-button">예시로 먼저 둘러보기 ↗</button></div></section></div>
<footer><span>졸업영화 편집실</span><span>사진·영상·음성은 서버에 업로드하지 않고 이 브라우저에서 처리해요.</span></footer></main>
<input id="projectInput" type="file" accept="application/json,.json" hidden><input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,.jfif" hidden><input id="videoInput" type="file" accept="video/mp4,video/webm,.mp4,.webm" hidden><input id="audioInput" type="file" accept="audio/*" hidden><div id="toast" role="status"></div>
